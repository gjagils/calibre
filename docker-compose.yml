version: "3.8"
services:
  calibre:
    image: ghcr.io/gjagils/calibre:latest
    container_name: calibre
    restart: unless-stopped
    network_mode: bridge
    shm_size: "1gb"
    ports:
      - "7081:8181"
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Amsterdam
      - TITLE=Calibre
      - CUSTOM_PORT=8080
      - CUSTOM_HTTPS_PORT=8181
      - CUSTOM_USER=${CUSTOM_USER:-gjagils}
      - PASSWORD=${PASSWORD:-}
    volumes:
      - /volume1/docker/calibre:/config
      - /volume1/homes/gjagils/boeken/bibliotheek:/books
      - /volume1/homes/gjagils/boeken/importmap:/import
